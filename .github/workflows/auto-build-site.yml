name: Publish generated site files
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic social-card renderer
        run: python -m pip install 'pillow==11.3.0'
      - name: Build generated pages
        run: python scripts/build_site.py
      - name: Commit generated output when needed
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "site: publish thought-leadership update"
          git push
