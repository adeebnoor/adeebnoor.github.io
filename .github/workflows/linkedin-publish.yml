name: Publish to LinkedIn and the site
on:
  issues:
    # Reopening a failed issue retries it right away.
    types: [opened, reopened]
  schedule:
    # Every hour: retry open "linkedin-publish" issues that could not be posted yet
    # (for example because a secret was added after the issue was opened).
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: site-content-main
  cancel-in-progress: false
jobs:
  publish:
    # Only the site owner's issue-form submissions are posted.
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && contains(github.event.issue.labels.*.name, 'linkedin-publish'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic social-card renderer
        run: python -m pip install 'pillow==11.3.0'
      - name: Post pending issues to LinkedIn and publish the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          STRICT: ${{ github.event_name == 'issues' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/linkedin_publish_pending.sh
