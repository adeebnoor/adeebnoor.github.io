name: Validate Adeeb Noor personal site
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deterministic social-card renderer
        run: python -m pip install 'pillow==11.3.0'
      - name: Validate site and private intake boundaries
        run: |
          python scripts/validate_site.py
          python scripts/validate_localization.py
          python scripts/validate_identity.py
          python scripts/validate_ideas.py
          python scripts/validate_analytics.py
          python scripts/validate_audit.py
          node --test scripts/test_analytics.mjs scripts/test_dashboard.mjs scripts/test_inquiries.mjs
          python scripts/build_site.py
          git diff --exit-code
          node --check nav.js
          node --check portfolio.js
          node --check site-nav.js
          node --check ar/writing/share.js
          node --check analytics/dashboard.js
          node --check privacy.js
          node --check contact-form.js
          node --check inquiries/inbox.js
