name: Validate Adeeb Noor personal site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate site
        run: |
          test -s index.html
          test -s home-final.css
          test -s style.css
          test -s inner.css
          test -s nav.css
          test -s nav.js
          test -s site-data.js
          test -s cv.css
          test -s data/site_identity.json
          test -s data/master_cv.json
          test -s about.html
          test -s research.html
          test -s publications.html
          test -s ventures.html
          test -s teaching.html
          test -s phd.html
          test -s speaking.html
          test -s impact.html
          test -s master-cv.html
          test -s executive-cv.html
          test -s academic-cv.html
          test -s contact.html
          test -s collaborate.html
          test -s ar/index.html
          test -s writing/index.html
          test -s 404.html
          test -s favicon.svg
          test -s site.webmanifest
          test -s sitemap.xml
          test -s robots.txt
          test -s demo/index.html
          test -s assets/portfolio-art.webp
          test -s portfolio.css
          test -s portfolio.js
          python scripts/validate_site.py
          python scripts/validate_localization.py
          python scripts/validate_identity.py
          python scripts/validate_ideas.py
          python scripts/validate_analytics.py
          node --test scripts/test_analytics.mjs scripts/test_dashboard.mjs
          python scripts/build_site.py
          git diff --exit-code
          node --check nav.js
          node --check portfolio.js
          node --check site-nav.js
          node --check ar/writing/share.js
          node --check analytics/dashboard.js
          node --check privacy.js
