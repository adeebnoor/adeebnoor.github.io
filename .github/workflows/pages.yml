name: Deploy Adeeb Noor personal site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site
        run: |
          test -s index.html
          test -s style.css
          test -s inner.css
          test -s about.html
          test -s research.html
          test -s publications.html
          test -s ventures.html
          test -s teaching.html
          test -s phd.html
          test -s speaking.html
          test -s collaborate.html
          test -s 404.html
          test -s favicon.svg
          test -s site.webmanifest
          test -s sitemap.xml
          test -s robots.txt
          test -s demo/index.html
          test -s assets/hero-right.webp
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          pages = [
              Path('index.html'), Path('about.html'), Path('research.html'),
              Path('publications.html'), Path('ventures.html'), Path('teaching.html'),
              Path('phd.html'), Path('speaking.html'), Path('collaborate.html'),
              Path('404.html')
          ]

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      d=dict(attrs)
                      if d.get('href'): self.hrefs.append(d['href'])

          missing=[]
          for page in pages:
              parser=Links(); parser.feed(page.read_text(encoding='utf-8'))
              for href in parser.hrefs:
                  if href.startswith(('#','mailto:','tel:','javascript:','data:')):
                      continue
                  u=urlsplit(href)
                  if u.scheme in ('http','https') or u.netloc:
                      continue
                  path=u.path
                  if not path:
                      continue
                  target = Path(path.lstrip('/')) if path.startswith('/') else page.parent / path
                  if path.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      missing.append(f'{page}: {href} -> {target}')
          if missing:
              raise SystemExit('Broken internal links:\n' + '\n'.join(missing))
          print(f'Validated {len(pages)} HTML pages and their internal links.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
