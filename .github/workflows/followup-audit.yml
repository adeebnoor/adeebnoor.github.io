name: Verify focused audit follow-up
on:
  push:
    branches: [audit-followup-20260914]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audit-followup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install QA tooling
        run: |
          python -m pip install 'pillow==11.3.0'
          npm install --no-save --package-lock=false playwright @axe-core/playwright agent-browser
          npx playwright install --with-deps chromium
      - name: Apply and validate source changes
        run: |
          python scripts/apply_followup.py
          python scripts/build_site.py
          python scripts/build_site.py
          python scripts/validate_site.py
          python scripts/validate_localization.py
          python scripts/validate_identity.py
          python scripts/validate_ideas.py
          python scripts/validate_audit.py
          python scripts/validate_analytics.py
          node --test scripts/test_analytics.mjs scripts/test_dashboard.mjs scripts/test_inquiries.mjs
      - name: Browser QA without real inquiry submissions
        run: |
          mkdir -p audit-artifacts
          python -m http.server 8000 >/tmp/followup-server.log 2>&1 &
          npx agent-browser open http://127.0.0.1:8000
          npx agent-browser snapshot -i > audit-artifacts/home-snapshot.txt
          npx agent-browser close
          node scripts/qa_audit.mjs
      - name: Save verified generated source on review branch
        run: |
          test "$GITHUB_REF_NAME" = audit-followup-20260914
          git add -- data i18n scripts '*.html' '*.css' '*.js' '*.xml' '*.png'
          git reset -- node_modules audit-artifacts package.json package-lock.json 2>/dev/null || true
          python scripts/build_site.py
          git diff --exit-code
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Date essay archive cards and make the actual contact form the primary path'
            git push origin HEAD:audit-followup-20260914
          fi
      - name: Record source revision
        if: always()
        run: |
          mkdir -p audit-artifacts
          git log -1 --format='%H %s' > audit-artifacts/revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: followup-audit-qa
          path: audit-artifacts/
          retention-days: 14
