name: One-time RIDI analytics allowlist repair

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Allow the exact public RIDI repository destination
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/portfolio-collect/index.ts')
          text = path.read_text(encoding='utf-8')
          needle = "  'https://github.com/adeebnoor/Miyar',\n"
          addition = "  'https://github.com/adeebnoor/ridi',\n"
          if addition not in text:
              if needle not in text:
                  raise SystemExit('Expected destination anchor not found')
              text = text.replace(needle, addition + needle, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Verify analytics contract
        run: node --test scripts/test_analytics.mjs
      - name: Commit exact-destination allowlist update
        run: |
          if git diff --quiet; then
            echo 'No allowlist change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/portfolio-collect/index.ts
          git commit -m 'Allow analytics for public RIDI repository link'
          git push
