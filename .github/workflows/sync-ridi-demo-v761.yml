name: One-time RIDI demo v76.1 sync

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Align RIDI demo with v76.1 terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          reps = {
            'Interactive RIDI SciFact 275 replay.':'Interactive RIDI selection-identity replay and RAG evidence example.',
            'RIDI · PREREGISTERED RAG · SCIFACT 275':'RIDI · SELECTION IDENTITY · PREREGISTERED RAG',
            'Identical audits can yield different AI decisions.':'Same retrieval evaluation. Different evidence. Different answer.',
            '<strong>17.27% of benchmark-defined RAG decisions flip</strong> at the preregistered primary condition, even when the registered retrieval audit is held exactly fixed.':'In the preregistered experiment, <strong>answer correctness changed in 17.27% of primary comparisons</strong> (equal-weight mean across four datasets) while the full assessed relevance-by-rank pattern and five retrieval metrics were held fixed.',
            'Run the decisive case':'Replay one registered example',
            'Same positive passage. Same rank. Same retrieval metrics.':'Same relevant passage. Same rank. Same relevance pattern. Same five metrics.',
            'AUDIT SIGNATURE: IDENTICAL':'RETRIEVAL EVALUATION: IDENTICAL',
            'Context B · identity substitution':'Context B · random zero-grade replacement',
            "<strong>Same audit. Different allocation. Different decision.</strong>":"<strong>Same retrieval evaluation. Different selected evidence. Different model output.</strong>",
            '</section><footer>RIDI · Adeeb Noor · King Abdulaziz University · Research software and evidence.</footer>':'<div class="status"><strong>RIDI is the audit toolkit.</strong> Selection identity is the object being measured; the identity–utility frontier computes the minimum turnover compatible with an explicit utility budget. <a href="/research.html#ridi">See the broader research program →</a></div></section><footer>RIDI · Selection identity auditing · Adeeb Noor · King Abdulaziz University.</footer>',
          }
          for a,b in reps.items():
              if a not in s:
                  raise SystemExit('Missing demo text: '+a[:90])
              s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')

          # Translation dictionary used to regenerate the Arabic page.
          p = Path('i18n/ar/projects.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          block = data.get('demo/index.html',{}).get('text',{})
          mapping = {
            'Interactive RIDI selection-identity replay and RAG evidence example.':'إعادة عرض تفاعلية لهوية الاختيار في RIDI ومثال من أدلة RAG.',
            'RIDI · SELECTION IDENTITY · PREREGISTERED RAG':'RIDI · هوية الاختيار · RAG مسجل مسبقًا',
            'Same retrieval evaluation. Different evidence. Different answer.':'التقييم نفسه للاسترجاع. أدلة مختلفة. إجابة مختلفة.',
            'In the preregistered experiment, answer correctness changed in 17.27% of primary comparisons (equal-weight mean across four datasets) while the full assessed relevance-by-rank pattern and five retrieval metrics were held fixed.':'في التجربة المسجلة مسبقًا، تغيّرت صحة الإجابة في 17.27% من المقارنات الأساسية (متوسط متساوي الأوزان عبر أربع مجموعات بيانات)، مع تثبيت نمط درجات الصلة بحسب الرتبة ومقاييس الاسترجاع الخمسة بالكامل.',
            'Replay one registered example':'أعد تشغيل مثال مسجل',
            'Same relevant passage. Same rank. Same relevance pattern. Same five metrics.':'المقطع ذو الصلة نفسه، والرتبة نفسها، ونمط الصلة نفسه، والمقاييس الخمسة نفسها.',
            'RETRIEVAL EVALUATION: IDENTICAL':'تقييم الاسترجاع: متطابق',
            'Context B · random zero-grade replacement':'السياق B · استبدال عشوائي لمقاطع بدرجة صلة صفرية',
            'Same retrieval evaluation. Different selected evidence. Different model output.':'تقييم الاسترجاع نفسه. أدلة مختارة مختلفة. مخرج مختلف للنموذج.',
            'RIDI is the audit toolkit.':'RIDI هو إطار وأداة التدقيق.',
            'Selection identity is the object being measured; the identity–utility frontier computes the minimum turnover compatible with an explicit utility budget.':'هوية الاختيار هي الكمية التي نقيسها؛ وتحسب جبهة الهوية–المنفعة الحد الأدنى للدوران المتوافق مع ميزانية منفعة صريحة.',
            'See the broader research program →':'اطّلع على البرنامج البحثي الأوسع ←',
            'RIDI · Selection identity auditing · Adeeb Noor · King Abdulaziz University.':'RIDI · تدقيق هوية الاختيار · أديب نور · جامعة الملك عبدالعزيز.'
          }
          block.update(mapping)
          # Remove obsolete keys so they cannot be reused accidentally.
          for old in ['AUDIT SIGNATURE: IDENTICAL','Context B · identity substitution','Same positive passage. Same rank. Same retrieval metrics.','Run the decisive case','Identical audits can yield different AI decisions.','RIDI · PREREGISTERED RAG · SCIFACT 275']:
              block.pop(old,None)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Rebuild and validate bilingual site
        run: |
          python scripts/build_site.py
          python scripts/validate_site.py
          python scripts/validate_localization.py
          python scripts/validate_identity.py
          node --test scripts/test_analytics.mjs
      - name: Commit synchronized demo
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align RIDI demo with selection identity and frontier framing'
          git push
