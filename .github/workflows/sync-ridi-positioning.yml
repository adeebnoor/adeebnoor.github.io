name: One-time RIDI frontier positioning sync

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic social-card renderer
        run: python -m pip install 'pillow==11.3.0'
      - name: Update RIDI source positioning
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          path = root / 'data' / 'featured-projects.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          for p in data:
              if p.get('id') == 'ridi':
                  p['en'].update({
                      'stage': 'Research & open-source audit toolkit',
                      'domain': 'Ranking update governance',
                      'description': 'Measure how much a ranking update changes the selected items, then compute the exact minimum turnover compatible with a declared utility budget.',
                      'cta': 'Explore RIDI',
                      'alt': 'RIDI: measuring selection change and the identity–utility frontier',
                      'ideaCta': 'Why selection change needs a budget',
                  })
                  p['ar'].update({
                      'stage': 'بحث وأداة تدقيق مفتوحة المصدر',
                      'domain': 'حوكمة تحديث أنظمة الترتيب',
                      'description': 'قياس مقدار تغيّر العناصر المختارة بعد تحديث نظام الترتيب، ثم حساب الحد الأدنى الدقيق للتغيّر المتوافق مع ميزانية منفعة معلنة.',
                      'cta': 'استكشف RIDI',
                      'alt': 'RIDI: قياس تغيّر الاختيار وجبهة الهوية–المنفعة',
                      'ideaCta': 'لماذا يحتاج تغيّر الاختيار إلى ميزانية',
                  })
                  p['repoUrl'] = 'https://github.com/adeebnoor/ridi'
                  p['osfUrl'] = 'https://osf.io/txwdv/'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = root / 'data' / 'master_cv.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          new = 'Selection identity and the identity–utility frontier: measuring ranking-update turnover and computing the exact minimum change compatible with a declared utility budget.'
          data['research'] = [[name, new if name == 'RIDI' else desc] for name, desc in data.get('research', [])]
          for role in data.get('experience', []):
              if role.get('title','').startswith('Full Professor'):
                  role['bullets'] = [
                      b.replace('Develops research programs spanning allocation identity, drug-interaction knowledge, neuro-symbolic AI and curriculum systems.',
                                'Develops research programs spanning ranking-update governance and allocation identity, drug-interaction knowledge, neuro-symbolic AI and curriculum systems.')
                      for b in role.get('bullets', [])
                  ]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = root / 'research.html'
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<h2>Allocation Identity in AI</h2>': '<h2>RIDI: Selection Identity &amp; the Identity–Utility Frontier</h2>',
              'Two systems can report similar aggregate performance while allocating scarce opportunities, risks or errors to different people. RIDI makes that hidden allocation structure visible.': 'RIDI measures how much a ranking update changes the selected items and computes the exact minimum turnover compatible with a declared rank-utility budget. A preregistered RAG experiment shows that exactly matched retrieval evaluations can leave selected evidence unresolved.',
              '<b>Core question:</b> Who receives the outcome when capacity is finite?': '<b>Core question:</b> How much selection change did the update require — and how much was avoidable?',
              '<b>Focus:</b> ranking-to-action systems, allocation identity, consequential evaluation.': '<b>Focus:</b> ranking updates, allocation identity, the identity–utility frontier and consequential evaluation.',
              '<b>Translation:</b> interactive evaluation and governance tools.': '<b>Translation:</b> exact turnover budgeting, reproducible audit tooling and outcome-checked update governance.',
              '<div class="now-item"><b>Allocation identity</b><span>Expose who changes when a system acts under limited capacity.</span></div>': '<div class="now-item"><b>Selection identity &amp; utility</b><span>Measure what changed, then compute the minimum turnover compatible with an explicit utility budget.</span></div>',
          }
          for a,b in replacements.items():
              if a not in text:
                  raise SystemExit(f'Missing expected research.html source text: {a[:80]}')
              text = text.replace(a,b)
          path.write_text(text, encoding='utf-8')

          path = root / 'i18n' / 'ar' / 'research.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          trans = data['research.html']['text']
          trans['RIDI: Selection Identity & the Identity–Utility Frontier'] = 'RIDI: هوية الاختيار وجبهة الهوية–المنفعة'
          trans['RIDI measures how much a ranking update changes the selected items and computes the exact minimum turnover compatible with a declared rank-utility budget. A preregistered RAG experiment shows that exactly matched retrieval evaluations can leave selected evidence unresolved.'] = 'يقيس RIDI مقدار تغيّر العناصر المختارة بعد تحديث نظام الترتيب، ويحسب الحد الأدنى الدقيق للتغيّر المتوافق مع ميزانية منفعة معلنة. وتُظهر تجربة RAG مسجلة مسبقًا أن التطابق التام في تقييمات الاسترجاع قد يترك هوية الأدلة المختارة غير محددة.'
          trans['How much selection change did the update require — and how much was avoidable?'] = 'كم من تغيّر الاختيار كان التحديث يتطلبه فعلاً، وكم منه كان قابلًا للتجنب؟'
          trans['ranking updates, allocation identity, the identity–utility frontier and consequential evaluation.'] = 'تحديثات أنظمة الترتيب، وهوية التخصيص، وجبهة الهوية–المنفعة، والتقييم المرتبط بالعواقب.'
          trans['exact turnover budgeting, reproducible audit tooling and outcome-checked update governance.'] = 'ميزنة دقيقة لدوران الاختيارات، وأدوات تدقيق قابلة لإعادة الإنتاج، وحوكمة للتحديثات تُراجع مقابل النتائج.'
          trans['Selection identity & utility'] = 'هوية الاختيار والمنفعة'
          trans['Measure what changed, then compute the minimum turnover compatible with an explicit utility budget.'] = 'قِس ما تغيّر، ثم احسب الحد الأدنى للدوران المتوافق مع ميزانية منفعة صريحة.'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = root / 'data' / 'site-audit-content.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          repos = data.get('repositories', [])
          if not any(r.get('name') == 'RIDI' for r in repos):
              repos.insert(0, {
                  'name': 'RIDI',
                  'url': 'https://github.com/adeebnoor/ridi',
                  'body': {
                      'en': 'Selection-change auditing and the exact identity–utility frontier for ranking updates.',
                      'ar': 'تدقيق تغيّر الاختيارات وجبهة الهوية–المنفعة الدقيقة لتحديثات أنظمة الترتيب.'
                  }
              })
          data['repositories'] = repos
          data['revision'] = '2026-09-15'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = root / 'data' / 'ideas-content.json'
          if path.exists():
              obj = json.loads(path.read_text(encoding='utf-8'))
              pairs = [
                  ('I connect this argument to my research on RIDI and on the relationship between evaluation and downstream decisions.',
                   'I connect this argument to RIDI, a research and software program that measures selection change and computes the exact minimum turnover compatible with a declared utility budget.'),
                  ('أربط هذه الحجة بأبحاثي حول RIDI',
                   'أربط هذه الحجة ببرنامج RIDI البحثي والبرمجي الذي يقيس تغيّر الاختيارات ويحسب الحد الأدنى الدقيق للدوران المتوافق مع ميزانية منفعة معلنة')
              ]
              def walk(x):
                  if isinstance(x, str):
                      for a,b in pairs:
                          x = x.replace(a,b)
                      return x
                  if isinstance(x, list): return [walk(v) for v in x]
                  if isinstance(x, dict): return {k:walk(v) for k,v in x.items()}
                  return x
              path.write_text(json.dumps(walk(obj), ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Rebuild all generated bilingual pages and validate
        run: |
          python scripts/build_site.py
          python scripts/validate_site.py
          python scripts/validate_localization.py
          python scripts/validate_identity.py
          python scripts/validate_ideas.py
          python scripts/validate_audit.py
      - name: Commit synchronized public site
        run: |
          if git diff --quiet; then
            echo 'No RIDI positioning changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align RIDI public positioning with identity-utility frontier'
          git push
