name: Verify live critical portfolio features
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-critical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright agent-browser
          npx playwright install --with-deps chromium
      - name: Verify live content, dates, navigation, project parity and intake
        run: |
          mkdir -p live-critical
          node scripts/verify_live_critical.mjs
          npx agent-browser open https://adeebnoor.github.io/
          npx agent-browser snapshot -i > live-critical/home-snapshot.txt
          npx agent-browser close
      - name: Verify Kinetic HR expert reviewer mode
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const appErrors = [];
            const serviceWarnings = [];
            page.on('pageerror', e => appErrors.push('pageerror: ' + e.message));
            page.on('response', r => {
              if (r.status() < 400) return;
              const url = r.url();
              if (url.includes('/functions/v1/portfolio-collect')) { serviceWarnings.push(`${r.status()} ${url}`); return; }
              if (url.startsWith('https://adeebnoor.github.io/kinetic-hr/')) appErrors.push(`${r.status()} ${url}`);
            });
            await page.goto('https://adeebnoor.github.io/kinetic-hr/?review=1&v=170&lang=ar', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForSelector('#kh-review-overlay.open', { timeout: 15000 });
            const summary = await page.evaluate(() => ({
              title: document.title,
              reviewOpen: document.querySelector('#kh-review-overlay')?.classList.contains('open') || false,
              tabs: document.querySelectorAll('.kh-review-tab').length,
              dimensions: document.querySelectorAll('[data-score]').length,
              reviewerButton: !!document.querySelector('#kh-review-fab'),
              decisionContext: !!document.querySelector('#v07-review-context')
            }));
            if (!summary.reviewOpen) throw new Error('Reviewer Mode did not auto-open');
            if (summary.tabs !== 5) throw new Error(`Expected 5 reviewer tabs, found ${summary.tabs}`);
            if (summary.dimensions !== 10) throw new Error(`Expected 10 review dimensions, found ${summary.dimensions}`);
            if (!summary.reviewerButton) throw new Error('Reviewer button missing');
            if (!summary.decisionContext) throw new Error('v0.7 reviewer context missing');
            await page.click('.kh-review-tab[data-rpage="evidence"]');
            await page.waitForFunction(() => document.querySelectorAll('#kh-evidence-cell option').length > 0, null, { timeout: 10000 });
            const evidence = await page.evaluate(() => ({ cells: document.querySelectorAll('#kh-evidence-cell option').length, text: document.querySelector('#kh-evidence-content')?.innerText || '' }));
            if (evidence.cells < 1) throw new Error('Evidence picker has no workforce cells');
            if (!/SHA256-[a-f0-9]{64}/i.test(evidence.text)) throw new Error('Evidence view is missing its SHA-256 state fingerprint');
            await page.click('.kh-review-tab[data-rpage="feedback"]');
            await page.fill('#kh-r-role', 'CI HR Reviewer');
            await page.fill('#kh-r-years', '40');
            await page.selectOption('#kh-r-use', 'maybe');
            await page.fill('#kh-r-strong', 'Continuous auditable occupational gap surveillance');
            await page.fill('#kh-r-must', 'Calibrate with real pilot data');
            await page.click('#kh-save-review');
            const saved = await page.evaluate(() => ({ stored: JSON.parse(localStorage.getItem('kinetic_hr_v06_reviews') || '[]').length }));
            if (saved.stored < 1) throw new Error('Reviewer feedback was not persisted');
            await page.screenshot({ path: 'live-critical/kinetic-hr-reviewer-v07.png', fullPage: true });
            fs.writeFileSync('live-critical/kinetic-hr-reviewer-v07.json', JSON.stringify({ summary, evidence: { cells: evidence.cells }, saved, appErrors, serviceWarnings }, null, 2));
            if (appErrors.length) throw new Error('Kinetic app errors: ' + appErrors.join(' | '));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Verify Kinetic HR v0.7 decision reality
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
            const errors=[];
            page.on('pageerror', e => errors.push('pageerror: '+e.message));
            page.on('response', r => { if (r.status() >= 400 && r.url().startsWith('https://adeebnoor.github.io/kinetic-hr/')) errors.push(`${r.status()} ${r.url()}`); });
            await page.goto('https://adeebnoor.github.io/kinetic-hr/?v=170&lang=en', {waitUntil:'networkidle', timeout:60000});
            await page.locator('[data-v14-enter]').first().click();
            await page.click('.nav-item[data-view="dashboard"]');
            await page.waitForSelector('#v07-exec-translation', {timeout:15000});
            const landing=await page.evaluate(()=>({
              engine:document.querySelector('#sidebar-engine-state')?.textContent||'',
              translation:document.querySelector('#v07-exec-translation')?.innerText||'',
              funded:document.querySelectorAll('.v07-funding-strip span').length,
              briefButton:!!document.querySelector('#v07-brief-btn')
            }));
            if(!landing.engine.includes('KH-DECISION-v0.7')) throw new Error('v0.7 engine label missing');
            if(landing.funded!==3) throw new Error('Funding lens missing');
            if(!landing.briefButton) throw new Error('Executive brief button missing');
            await page.click('.nav-item[data-view="scenario"]');
            await page.locator('#v14-advanced>summary').click();
            await page.waitForSelector('#v07-reality-panel');
            if (await page.locator('#v07-reality-panel').getAttribute('open') === null) await page.locator('#v07-reality-panel>summary').click();
            const donorCount=await page.locator('#scenario-donor option').count();
            if(donorCount<2) throw new Error('Expected a same-SSCO donor option in EDU demo');
            const donorValue=await page.locator('#scenario-donor option').nth(1).getAttribute('value');
            await page.selectOption('#scenario-donor', donorValue);
            await page.fill('#v07-safety-pct','5');
            await page.fill('#v07-approval-transfer','14');
            await page.fill('#v07-cost-transfer','10000');
            await page.fill('#v07-budget','60000');
            await page.locator('#transfer-range').evaluate(el=>{el.value='8';el.dispatchEvent(new Event('input',{bubbles:true}))});
            await page.waitForTimeout(250);
            const impact=await page.evaluate(()=>{
              const r=getRowBySource(selectedScenarioSource); const v=scenarioValues(); const i=scenarioImpact(r,v);
              return {requested:i.requestedTransfer,actual:i.actualTransfer,transferable:i.transferableSurplus,cost:i.totalCostSar,budget:i.budgetState,approval:i.approvalLatencyDays?.transfer,decisionLayer:i.decisionLayer,text:document.querySelector('#v07-decision-result')?.innerText||''};
            });
            if(!(impact.requested===8 && impact.actual<=impact.transferable && impact.actual<8)) throw new Error('Safety-buffer transfer cap failed: '+JSON.stringify(impact));
            if(impact.cost!==impact.actual*10000) throw new Error('Cost calculation failed: '+JSON.stringify(impact));
            if(impact.budget!=='within') throw new Error('Budget constraint failed: '+JSON.stringify(impact));
            if(impact.approval!==14) throw new Error('Approval latency not captured');
            if(impact.decisionLayer!=='KH-DECISION-v0.7') throw new Error('Decision layer version missing');
            await page.click('#v07-brief-btn');
            await page.waitForSelector('#v07-brief-overlay.open');
            const brief=await page.evaluate(()=>({items:document.querySelectorAll('.v07-brief-item').length,text:document.querySelector('#v07-brief-content')?.innerText||''}));
            if(brief.items<1) throw new Error('Executive brief has no decisions');
            if(!/SHA-256|SHA256/i.test(brief.text)) throw new Error('Executive brief governance fingerprint note missing');
            await page.screenshot({path:'live-critical/kinetic-hr-v07-decision.png',fullPage:true});
            fs.writeFileSync('live-critical/kinetic-hr-v07-decision.json',JSON.stringify({landing,impact,brief:{items:brief.items},errors},null,2));
            if(errors.length) throw new Error('Kinetic v0.7 errors: '+errors.join(' | '));
            await browser.close();
            console.log('Kinetic HR v0.7 verified:', JSON.stringify({landing,impact,briefItems:brief.items}));
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-critical-evidence
          path: live-critical/
          retention-days: 14
