name: LinkedIn post
description: Show a LinkedIn post in the "From LinkedIn" section of adeebnoor.github.io
title: "LinkedIn post"
labels: ["linkedin-post"]
body:
  - type: input
    id: url
    attributes:
      label: Post link
      description: On LinkedIn, open the post menu (…) → Copy link to post, then paste it here.
      placeholder: https://www.linkedin.com/posts/adeeb-noor_...
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Post text
      description: Paste the text of the post. The site shows the first lines and links to LinkedIn for the rest.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date (optional)
      description: YYYY-MM-DD. Leave empty to use today's date.
      placeholder: "2026-10-21"
