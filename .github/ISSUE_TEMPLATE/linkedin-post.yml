name: LinkedIn post
description: Show posts you already published on LinkedIn in the "From LinkedIn" section of adeebnoor.github.io (paste the links only)
title: "LinkedIn post"
labels: ["linkedin-post"]
body:
  - type: textarea
    id: url
    attributes:
      label: Post links
      description: On LinkedIn, open each post's menu (…) → Copy link to post, and paste it here. One link per line; several posts at once are fine. The site reads the text and date from the public post.
      placeholder: https://www.linkedin.com/posts/adeeb-noor_...
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: Post text
      description: Optional, for a single link only. Leave empty and the text is taken from LinkedIn.
  - type: input
    id: date
    attributes:
      label: Date (optional)
      description: Optional, for a single link only. YYYY-MM-DD. Leave empty to use the post's own date.
      placeholder: "2026-10-21"
